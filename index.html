<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Rezzy</title>
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
    <!-- Shown on mobile portrait orientation -->
    <div id="rotate-notice">
        <div class="rotate-icon">&#8635;</div>
        <p>Please rotate your device to landscape to play!</p>
    </div>

    <div id="game-container">
        <!-- Background video loop -->
        <video id="bg-video" autoplay loop muted playsinline>
            <source src="backgroundloop/newbackground.webm" type="video/webm">
            Your browser does not support the video tag.
        </video>
        <!-- Canvas for rendering character and game elements -->
        <canvas id="game-canvas" width="800" height="600"></canvas>

        <!-- Trophy Button -->
        <div id="trophy-btn" title="Leaderboard">🏆</div>

        <!-- Name Entry Modal (Hidden by default) -->
        <div id="name-modal" class="modal">
            <div class="modal-content">
                <h2>STREAK BROKEN!</h2>
                <p>You reached a streak of <span id="final-streak">0</span>!</p>
                <p>Enter your name (max 7 chars):</p>
                <input type="text" id="player-name" maxlength="7" placeholder="Name">
                <div class="modal-buttons">
                    <button id="submit-score-btn">Submit Score</button>
                    <button id="skip-score-btn">Skip</button>
                </div>
            </div>
        </div>

        <!-- Leaderboard Modal (Hidden by default) -->
        <div id="leaderboard-modal" class="modal">
            <div class="modal-content leaderboard-content">
                <h2>Top Streaks</h2>
                <div id="leaderboard-list">
                    <p>Loading...</p>
                </div>
                <div class="modal-buttons">
                    <button id="close-leaderboard-btn">Close</button>
                    <button id="play-again-btn">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js?v=7"></script>
</body>
</html>
