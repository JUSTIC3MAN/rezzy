<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezzy</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div id="game-container">
        <!-- Background video loop -->
        <video id="bg-video" autoplay loop muted playsinline>
            <source src="backgroundloop/Background.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <!-- Canvas for rendering character and game elements -->
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <!-- Foreground objects video loop -->
        <video id="fg-video" autoplay loop muted playsinline>
            <source src="backgroundloop/NewObjects.webm" type="video/webm">
            Your browser does not support the video tag.
        </video>
    </div>
    <script src="game.js?v=2"></script>
</body>
</html>
