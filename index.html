<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Rezzy</title>
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
    <!-- Shown on mobile portrait orientation -->
    <div id="rotate-notice">
        <div class="rotate-icon">&#8635;</div>
        <p>Please rotate your device to landscape to play!</p>
    </div>

    <div id="game-container">
        <!-- Background video loop -->
        <video id="bg-video" autoplay loop muted playsinline>
            <source src="backgroundloop/Background.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <!-- Canvas for rendering character and game elements -->
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <!-- Foreground objects video loop -->
        <video id="fg-video" autoplay loop muted playsinline>
            <source src="backgroundloop/NewObjects.webm" type="video/webm">
            <source src="backgroundloop/NewObjects.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    <script src="game.js?v=4"></script>
</body>
</html>
